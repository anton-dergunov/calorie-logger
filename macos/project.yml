name: CalorieLogger
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  CalorieLogger:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - sdk: Security.framework
      # "Open at login", registered through SMAppService rather than a launch agent plist.
      - sdk: ServiceManagement.framework
    preBuildScripts:
      - name: Build web interface
        script: |
          cd "$SRCROOT/.."
          npm --prefix web run build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle web interface
        script: |
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dist"
          mkdir -p "$destination"
          ditto "$SRCROOT/../web/dist" "$destination"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calorielogger.app
        PRODUCT_NAME: Calorie Logger
        PRODUCT_MODULE_NAME: CalorieLogger
        # Overridden per build by scripts/build-macos.sh from scripts/version.sh. The defaults are
        # what a bare `xcodebuild` produces; CURRENT_PROJECT_VERSION is the value the updater
        # compares, so a build without one must never look newer than a real release.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Calorie Logger
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHighResolutionCapable: YES
    scheme:
      testTargets:
        - CalorieLoggerTests
  CalorieLoggerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CalorieLogger
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Calorie Logger.app/Contents/MacOS/Calorie Logger"
        BUNDLE_LOADER: "$(TEST_HOST)"
