# The default Calorie Logger food catalogue.
#
# This is the library the app starts from: it is seeded into an account that has none, and it is
# what "Reset app data" in Settings restores. Edit it freely — every entry is plain data.
#
#   name      what the day log shows, so keep it short
#   picture   an id from pictures.yaml; the food stores it as `pic:<id>`
#   unit      g, ml, or item
#   basis     the amount the nutrition below is defined for; always 1 for item
#
# Nutrition is per 100 g or 100 ml unless stated, and per item for the fruit and vegetables that
# are bought and eaten one at a time.

