# The complete approved food picture set.
#
# `id` matches both `web/src/assets/pictures/<id>.webp` and the master artwork in `icons/<id>.png`;
# a food stores the value `pic:<id>`. The label is what the chooser shows, and label and keywords
# together are the text the bundled search model embeds, so they are written the way a food gets
# typed in, not the way a designer would name a file.
#
# Adding artwork means adding it to `icons/`, adding an entry here, and running
# `npm run generate:pictures`, which refuses to run while the two disagree.

# The default picture, used until a food has one of its own
- id: plate
  label: Plate
  keywords: [plate, meal, dish, food, dinner, cutlery, fork and knife]

